name: 打包

on:
  # 只在打 v* 标签时运行（提交 main 不触发）
  push:
    tags: ["v*"]
  # 保留手动触发入口，便于不发版测试构建
  workflow_dispatch:

jobs:
  # ============ Mojo 面板（Tauri，三平台；内含 Rust 引擎 + 语音链路）============
  panel:
    name: Mojo (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, name: macOS }
          - { os: windows-latest, name: Windows }
          - { os: ubuntu-22.04, name: Linux }

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # sherpa 预编译库体积大不入库；三平台各自下载（build.rs 按目标平台选目录）
      - name: 下载 sherpa-onnx 动态库
        if: runner.os == 'macOS'
        run: |
          curl -sL --fail -o /tmp/sherpa.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-v1.13.7-osx-arm64-shared.tar.bz2"
          tar xjf /tmp/sherpa.tar.bz2 -C /tmp
          mkdir -p third_party/sherpa-onnx
          cp -R /tmp/sherpa-onnx-v1.13.7-osx-arm64-shared/lib third_party/sherpa-onnx/
          cp -R /tmp/sherpa-onnx-v1.13.7-osx-arm64-shared/include third_party/sherpa-onnx/

      # v1 暂不在 Windows/Linux 产物里带 sherpa：DLL 不随安装包打进去会导致
      # 进程缺 DLL 无法启动；先以 stub 编译（云端 volc 引擎可用），
      # 待真机验证后再做 DLL/.so 随包分发（Windows resources / Linux rpath 布局）
      - name: 下载 sherpa-onnx 动态库（Windows，MD-Release 动态 CRT）
        if: false && runner.os == 'Windows'
        shell: bash
        run: |
          curl -sL --fail -o /tmp/sherpa.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-v1.13.7-win-x64-shared-MD-Release.tar.bz2"
          tar xjf /tmp/sherpa.tar.bz2 -C /tmp
          mkdir -p third_party/sherpa-onnx-win-x64
          cp -R /tmp/sherpa-onnx-v1.13.7-win-x64-shared-MD-Release/lib third_party/sherpa-onnx-win-x64/
          cp -R /tmp/sherpa-onnx-v1.13.7-win-x64-shared-MD-Release/include third_party/sherpa-onnx-win-x64/

      - name: 下载 sherpa-onnx 动态库（Linux）
        if: false && runner.os == 'Linux'
        run: |
          curl -sL --fail -o /tmp/sherpa.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-v1.13.7-linux-x64-shared.tar.bz2"
          tar xjf /tmp/sherpa.tar.bz2 -C /tmp
          mkdir -p third_party/sherpa-onnx-linux-x64
          cp -R /tmp/sherpa-onnx-v1.13.7-linux-x64-shared/lib third_party/sherpa-onnx-linux-x64/
          cp -R /tmp/sherpa-onnx-v1.13.7-linux-x64-shared/include third_party/sherpa-onnx-linux-x64/

      - name: Linux 系统依赖（WebKitGTK 等）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: 安装前端依赖
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: 构建 Tauri 应用
        working-directory: desktop
        env:
          # 更新包签名（仅 tag 发布时该 secret 有值；平时构建无签名也能出安装包）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: pnpm tauri build

      - name: 上传 macOS 产物
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: mojo-macos-arm64
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: warn
          retention-days: 14

      - name: 上传 Windows 产物
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: mojo-windows-x64
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip
            desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
          if-no-files-found: warn
          retention-days: 14

      - name: 上传 Linux 产物
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: mojo-linux-x64
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn
          retention-days: 14

  # ============ 发布到 GitHub Releases（仅打 v* 标签时）============
  release:
    name: 发布 Release
    needs: panel
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 需要仓库里的 desktop/scripts/gen-latest.py，必须先 checkout
      - uses: actions/checkout@v4

      - name: 下载全部平台产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 列出待发布文件
        run: find artifacts -type f | sort

      - name: 生成更新清单 latest.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release
          # 更新器包按固定文件名扁平化（方便清单引用，且覆盖更新不会累积旧资产名）
          find artifacts -name '*.app.tar.gz'       -exec cp {} release/mojo-macos-arm64.app.tar.gz \;
          find artifacts -name '*.app.tar.gz.sig'   -exec cp {} release/mojo-macos-arm64.app.tar.gz.sig \;
          find artifacts -name '*.nsis.zip' ! -name '*.sig' -exec cp {} release/mojo-windows-x64-setup.nsis.zip \;
          find artifacts -name '*.nsis.zip.sig'    -exec cp {} release/mojo-windows-x64-setup.nsis.zip.sig \;
          find artifacts -name '*.AppImage.tar.gz' ! -name '*.sig' -exec cp {} release/mojo-linux-x86_64.AppImage.tar.gz \;
          find artifacts -name '*.AppImage.tar.gz.sig' -exec cp {} release/mojo-linux-x86_64.AppImage.tar.gz.sig \;
          # 普通安装包（供手动下载）
          find artifacts -name '*.dmg' -exec cp {} release/ \;
          find artifacts -name '*.exe' -exec cp {} release/ \;
          find artifacts -name '*.AppImage' -exec cp {} release/ \;
          ls -la release
          VERSION="${TAG#v}" \
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" \
            python3 desktop/scripts/gen-latest.py release release/latest.json

      - name: 创建 / 更新 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: |
            release/latest.json
            release/*
