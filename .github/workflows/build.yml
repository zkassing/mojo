name: 打包

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ============ macOS 守护进程（Swift，仅 macOS 能编）============
  daemon:
    name: 守护进程 (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 下载 sherpa-onnx 动态库（体积大不入库）
        run: |
          curl -sL --fail -o /tmp/sherpa.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-v1.13.7-osx-arm64-shared.tar.bz2"
          tar xjf /tmp/sherpa.tar.bz2 -C /tmp
          mkdir -p third_party/sherpa-onnx
          cp -R /tmp/sherpa-onnx-v1.13.7-osx-arm64-shared/lib third_party/sherpa-onnx/
          cp -R /tmp/sherpa-onnx-v1.13.7-osx-arm64-shared/include third_party/sherpa-onnx/

      - name: 编译并打包 mojo.app（无证书时自动 ad-hoc 签名）
        run: ./build-app.sh

      - name: 收集产物
        run: |
          mkdir -p /tmp/dist
          ditto -c -k --keepParent \
            "$HOME/Library/Application Support/mojo/mojo.app" \
            /tmp/dist/mojo-daemon-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mojo-daemon-macos-arm64
          path: /tmp/dist/mojo-daemon-macos-arm64.zip
          retention-days: 14

  # ============ 控制面板（Tauri，三平台）============
  panel:
    name: 控制面板 (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, name: macOS }
          - { os: windows-latest, name: Windows }
          - { os: ubuntu-22.04, name: Linux }

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Linux 系统依赖（WebKitGTK 等）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: 安装前端依赖
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: 构建 Tauri 应用
        working-directory: desktop
        run: pnpm tauri build

      - name: 上传 macOS 产物
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: mojo-panel-macos-arm64
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 14

      - name: 上传 Windows 产物
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: mojo-panel-windows-x64
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 14

      - name: 上传 Linux 产物
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: mojo-panel-linux-x64
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn
          retention-days: 14
